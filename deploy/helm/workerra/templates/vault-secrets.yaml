{{- /*
  Every credential comes from WSL Vault through ESO. Keys under each Vault path
  become keys of the Secret workerra-<name>. deletionPolicy Retain keeps the
  Secret if an entry is removed, so pods keep running until someone deletes it
  on purpose.
*/}}
{{- if .Values.ownVaultStore.enabled }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: workerra-vault
  labels:
    {{- include "workerra.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: https://vault.workstation.co.uk
      path: kv
      version: v2
      auth:
        tokenSecretRef:
          name: {{ required "ownVaultStore.tokenSecret is required" .Values.ownVaultStore.tokenSecret }}
          key: token
{{- end }}
{{- range $name, $key := .Values.vaultSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workerra-{{ $name }}
  labels:
    {{- include "workerra.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    {{- include "workerra.secretStoreRef" $ | nindent 4 }}
  target:
    name: workerra-{{ $name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ $key }}
{{- end }}
