apiVersion: apps/v1
kind: Deployment
metadata:
  name: workerra
  labels:
    {{- include "workerra.labels" . | nindent 4 }}
    {{- include "workerra.selector" . | nindent 4 }}
  annotations:
    # Stakater Reloader (runs on k3s1) rolls the pods when a Secret they load
    # changes, so a Vault edit reaches the app within ESO's 1m refresh, as on
    # workstation-opsapi. It reacts to updates, not to a Secret's first
    # creation: the deploy job restarts the pods for that case.
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "workerra.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "workerra.labels" . | nindent 8 }}
        {{- include "workerra.selector" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: APP_ENV
              value: {{ .Values.env | quote }}
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: SITE_URL
              value: {{ printf "https://%s" .Values.host | quote }}
            - name: PORT
              value: {{ .Values.port | quote }}
            {{- range $name, $value := .Values.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            {{- range $name, $path := .Values.vaultSecrets }}
            - secretRef:
                name: workerra-{{ $name }}
                optional: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: workerra
  labels:
    {{- include "workerra.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "workerra.selector" . | nindent 4 }}
