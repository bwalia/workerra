{{- /*
  Workerra's own OpsAPI backend: the job listings /jobs searches (ATS jobs plus
  Workerra's plugin, migrations/opsapi/). Same shape as closeknitty-opsapi: an
  image with the plugin baked in (Dockerfile.opsapi), its own Postgres, and a
  setup initContainer that migrates on every pod start. Cluster-internal only:
  no Ingress, and a NetworkPolicy admits only the Workerra web pods.

  Off unless opsapi.enabled is true. Needs the WSL Vault path in
  opsapi.vaultSecret first (docs/environments.md, "Workerra OpsAPI backend").
*/}}
{{- if .Values.opsapi.enabled }}
---
# POSTGRES_PASSWORD, JWT_SECRET_KEY, OPENSSL_SECRET_KEY, ADMIN_EMAIL, ADMIN_PASSWORD.
# Separate from workerra-core so the web pods never see OpsAPI's own credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workerra-opsapi
  labels:
    {{- include "workerra.labels" . | nindent 4 }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.vaultStore }}
  target:
    name: workerra-opsapi
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ required "opsapi.vaultSecret is required when opsapi.enabled" .Values.opsapi.vaultSecret }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workerra-opsapi
  labels:
    {{- include "workerra.labels" . | nindent 4 }}
    {{- include "workerra.component" (dict "name" "opsapi") | nindent 4 }}
spec:
  # One replica: the setup initContainer's project-migrator is not
  # concurrency-safe, and Recreate keeps two pods from migrating at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "workerra.component" (dict "name" "opsapi") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "workerra.labels" . | nindent 8 }}
        {{- include "workerra.component" (dict "name" "opsapi") | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z workerra-opsapi-postgres {{ .Values.opsapi.postgres.port }}; do echo waiting for postgres; sleep 2; done"]
        # Every step is idempotent, so it is safe on each pod start. An
        # initContainer rather than a pre-install hook Job because Postgres lives
        # in this release: a hook would run before it exists.
        #   1. OpsAPI's migrations for PROJECT_CODE's features, then every
        #      installed plugin's (Workerra's included)
        #   2. the Workerra workspace (NAMESPACE_*) and its admin (ADMIN_*), as a
        #      single tenant: a multi-code run would name it after the codes
        #   3. Workerra's plugin again, explicitly, so a missed plugin fails here
        - name: setup
          image: {{ include "workerra.opsapiImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /app
          command: ["sh", "-eu", "-c"]
          args:
            - |
              lapis migrate
              lapis exec "require('scripts.setup-namespace').run({ project_code = '{{ .Values.opsapi.tenantProjectCode }}' })"
              lapis exec "require('helper.project-migrator').migrate('workerra', '/app/projects/workerra')"
          env:
            {{- include "workerra.opsapiEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: workerra-opsapi
          resources:
            {{- toYaml .Values.opsapi.resources | nindent 12 }}
      containers:
        - name: opsapi
          image: {{ include "workerra.opsapiImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            {{- include "workerra.opsapiEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: workerra-opsapi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.opsapi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: workerra-opsapi
  labels:
    {{- include "workerra.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "workerra.component" (dict "name" "opsapi") | nindent 4 }}
{{- if .Values.opsapi.networkPolicy }}
---
# Only the Workerra web pods may call this OpsAPI. Operators reach it with
# `kubectl port-forward`, which this policy doesn't block.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workerra-opsapi
  labels:
    {{- include "workerra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "workerra.component" (dict "name" "opsapi") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "workerra.selector" . | nindent 14 }}
      ports:
        - port: http
---
# Postgres answers only its own OpsAPI pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workerra-opsapi-postgres
  labels:
    {{- include "workerra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "workerra.component" (dict "name" "opsapi-postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "workerra.component" (dict "name" "opsapi") | nindent 14 }}
      ports:
        - port: postgres
{{- end }}
{{- end }}
