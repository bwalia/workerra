{{- /* Postgres for the Workerra OpsAPI backend (templates/opsapi.yaml). Off unless opsapi.enabled. */}}
{{- if .Values.opsapi.enabled }}
{{- $pg := .Values.opsapi.postgres }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: workerra-opsapi-postgres
  labels:
    {{- include "workerra.labels" . | nindent 4 }}
    {{- include "workerra.component" (dict "name" "opsapi-postgres") | nindent 4 }}
spec:
  serviceName: workerra-opsapi-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "workerra.component" (dict "name" "opsapi-postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "workerra.labels" . | nindent 8 }}
        {{- include "workerra.component" (dict "name" "opsapi-postgres") | nindent 8 }}
    spec:
      # local-path volumes are node-local: the PV pins Postgres to the node it
      # first lands on, so keep this selector stable once data exists.
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          # pgvector: OpsAPI's migrations need the vector extension.
          image: {{ $pg.image }}
          ports:
            - name: postgres
              containerPort: {{ $pg.port }}
          env:
            - name: POSTGRES_DB
              value: {{ $pg.database | quote }}
            - name: POSTGRES_USER
              value: {{ $pg.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workerra-opsapi
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $pg.user | quote }}, "-d", {{ $pg.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ $pg.storageClass }}
        resources:
          requests:
            storage: {{ $pg.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: workerra-opsapi-postgres
  labels:
    {{- include "workerra.labels" . | nindent 4 }}
spec:
  ports:
    - name: postgres
      port: {{ $pg.port }}
      targetPort: postgres
  selector:
    {{- include "workerra.component" (dict "name" "opsapi-postgres") | nindent 4 }}
{{- end }}
