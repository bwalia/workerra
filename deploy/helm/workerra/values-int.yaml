# ── Workerra — INTEGRATION ─────────────────────────────────────────────────
# Release: workerra   Namespace: int   Cluster: k3s1
# Host: https://int.workerra.uk — Workstation VPN only (access profile on the
# wslproxy vhost, deploy/edge/wslproxy-server-int.json).
env: int
host: int.workerra.uk

vaultSecrets:
  core: workerra/int/core

extraEnv:
  # The int ring's NebulaDB (cluster-internal), as in docs/chatbot-reference.md.
  NEBULA_URL: "http://nebuladb.int.svc.cluster.local:8080"
  LOG_LEVEL: "debug"

# Any healthy LAN amd64 node, as workstation-opsapi does: net-region=home keeps
# it on the LAN next to the ring's services (the cloud<->LAN mesh is
# unreliable); arch=amd64 keeps it off the arm64 Pi.
nodeSelector:
  net-region: home
  kubernetes.io/arch: amd64
