# Base defaults for the Workerra chart. Per-ring overlays: values-<ring>.yaml.
# Installed as release `workerra` into the shared ring namespaces
# (int/test/acc/prod), like jobshout-com and closeknitty.
#
# No credential is ever set here (the repo is public). Every secret comes from
# WSL Vault (https://vault.workstation.co.uk, KV v2 mount `kv`) through the
# wslvault-backend ClusterSecretStore. See docs/environments.md.

# Ring name, passed to the app as APP_ENV (local|int|test|acc|prod).
env: int
# Public host. Single source of truth for the deploy workflow's DNS and edge
# jobs, which read it with awk: keep it a plain top-level `host: <fqdn>` line.
host: int.workerra.uk

image:
  repository: harneetk78/workerra
  # Set by the deploy workflow: --set image.tag=<short sha>. Also exported as
  # APP_VERSION, which /api/health reports and Ring Promoter verifies.
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1
port: 3000

# One ExternalSecret per entry; ESO copies every key under the Vault path into a
# Secret named workerra-<entry>, loaded into the pod with envFrom. Vault key
# names must equal the env var names the app reads (see .env.example).
# The Secrets are optional in the pod: until a Vault path exists the app still
# starts, with the integrations it guards (e.g. the assistant) reported offline.
vaultStore: wslvault-backend
# Optional Workerra-only Vault tenant. When enabled, the chart creates a
# namespaced SecretStore `workerra-vault` that authenticates with the token in
# Secret <tokenSecret> (key `token`, a WSLVault session JWT) in the ring
# namespace, and every Workerra ExternalSecret reads through it instead of the
# shared vaultStore. Create that Secret by hand before enabling; with
# tokenRefresh on, the chart keeps it fresh (docs/environments.md, "Secrets").
ownVaultStore:
  enabled: false
  server: https://vault.workstation.co.uk
  tokenSecret: workerra-vault-token
  # WSLVault session JWTs last one hour, so a hand-pasted token goes stale.
  # tokenRefresh adds a CronJob (templates/vault-token-refresh.yaml) that trades
  # the long-lived machine API key in Secret <apiKeySecret> (keys `api_key` and
  # `tenant_id`, created by hand) for a fresh JWT and patches it into
  # <tokenSecret>. It refuses a key from another tenant or with policies other
  # than expectedPolicies. Setup and recovery: docs/environments.md, "Secrets".
  tokenRefresh:
    enabled: false
    apiKeySecret: workerra-vault-apikey
    # Policy names the API key must carry, exactly.
    expectedPolicies: []
    # Three runs per one-hour token: one run can fail and the token still has
    # ~40 minutes left, so ESO keeps working through a single bad run.
    schedule: "*/20 * * * *"
    suspend: false
    maxAttempts: 5
    image:
      repository: alpine/k8s
      tag: 1.30.2
      # Required: the job holds the API key, so it runs only by digest. This is
      # the multi-arch index for alpine/k8s:1.30.2 (Docker Hub registry, Hub
      # API and the image wslvpn/wslvault-token-refresh runs all agree). To
      # change it: docker buildx imagetools inspect alpine/k8s:<tag>.
      digest: sha256:cd560fce90f76d2da46bce0624b65258c45ab3350f7073d6722fa74c7b3a3601
vaultSecrets:
  # NEBULA_API_KEY, OPSAPI_URL, OPSAPI_NAMESPACE, OPSAPI_API_KEY, SESSION_SECRET, ...
  core: workerra/int/core

# Workerra's own OpsAPI backend (templates/opsapi.yaml, opsapi-postgres.yaml):
# the job listings /jobs searches. Off by default. Turning it on needs the steps
# in docs/environments.md ("Workerra OpsAPI backend"), including the Vault path
# below and, for search, OPSAPI_API_KEY in vaultSecrets.core.
opsapi:
  enabled: false
  image:
    # Dockerfile.opsapi, built and pushed with the web image (same tag).
    repository: harneetk78/workerra-opsapi
    tag: ""
  # Migrations and features this OpsAPI runs: core plus the ATS.
  projectCode: core_only,ats
  # The tenant setup-namespace creates (named by namespaceName/Slug).
  tenantProjectCode: core_only
  namespaceName: Workerra
  namespaceSlug: workerra
  # POSTGRES_PASSWORD, JWT_SECRET_KEY, OPENSSL_SECRET_KEY, ADMIN_EMAIL, ADMIN_PASSWORD
  vaultSecret: workerra/int/opsapi
  networkPolicy: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  postgres:
    image: pgvector/pgvector:pg14
    port: 5432
    database: workerra_opsapi
    user: workerra
    storage: 10Gi
    storageClass: local-path
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits: { cpu: 500m, memory: 1Gi }

# Plain, non-secret env (e.g. in-cluster service URLs).
extraEnv: {}

ingress:
  enabled: true
  # TLS terminates on the wslproxy edge (pop0), which proxies plain HTTP to the
  # cluster ingress by Host header, so no cert-manager/tls block here.
  className: traefik

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }

nodeSelector: {}
