name: CI

# Checks only. Nothing here builds images or deploys (see docs/environments.md).
# GitHub-hosted runners on purpose: the repo is public, so fork PRs must not
# reach the self-hosted LAN runners JobShout uses.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
